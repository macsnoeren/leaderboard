name: leaderboard

services:
  leaderboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Host-netwerk: de AI-agent bereikt Ollama op localhost:11434 van de host
    network_mode: host
    init: true
    restart: unless-stopped
    environment:
      APP_PORT: ${APP_PORT:-8088}
      BASE_URL: ${BASE_URL:-}
      ENABLE_EMAIL: ${ENABLE_EMAIL:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Leeg = geen versleuteling (Mailpit); zonder waarde in .env blijft het 'tls'
      SMTP_SECURE: ${SMTP_SECURE-tls}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      FROM_EMAIL: ${FROM_EMAIL:-}
      FROM_NAME: ${FROM_NAME:-Assignment System}
      REQUIRE_2FA_ADMIN: ${REQUIRE_2FA_ADMIN:-false}
      # Link onder "Tools" in de admin-zijbalk; leeg = niet tonen
      DARKNET_CHAT_URL: ${DARKNET_CHAT_URL:-}
      # Maakt de API key 'docker-agent' aan voor de agent-container
      AI_AGENT_ENABLED: ${AI_AGENT_ENABLED:-1}
      # Worker: grootste upload voor import/restore (MB) en hoe lang exports en rapporten te downloaden zijn
      MAX_ARCHIVE_MB: ${WORKER_MAX_ARCHIVE_MB:-500}
      WORKER_RESULT_TTL_DAYS: ${WORKER_RESULT_TTL_DAYS:-7}
    volumes:
      - database:/var/www/leaderboard/database
      - artifacts:/var/www/leaderboard/htdocs/artifacts
      - uploads:/var/www/leaderboard/htdocs/uploads
      # Uploads, exports, rapporten en backups van de worker (buiten de webroot)
      - storage:/var/www/leaderboard/storage
      # Live wijzigingen in de PHP-pagina's zonder rebuild:
      # - ../htdocs:/var/www/leaderboard/htdocs

  # AI-agent: haalt teamberichten en design-taken op via api.php en gebruikt de Ollama op de host
  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    # Host-netwerk: Ollama luistert op de host alleen op localhost:11434
    network_mode: host
    init: true
    restart: unless-stopped
    # SIGINT: de agent meldt zich dan netjes af (unregister_agent)
    stop_signal: SIGINT
    depends_on:
      - leaderboard
    environment:
      APP_PORT: ${APP_PORT:-8088}
      AI_AGENT_ENABLED: ${AI_AGENT_ENABLED:-1}
      # Model en denkniveau per agent; leeg = de standaard (gpt-oss:20b-cloud / gpt-oss:120b-cloud, zie DESIGN.md §10)
      AI_INTENT_MODEL: ${AI_INTENT_MODEL:-}
      AI_INTENT_THINK: ${AI_INTENT_THINK:-}
      AI_HELPER_MODEL: ${AI_HELPER_MODEL:-}
      AI_HELPER_THINK: ${AI_HELPER_THINK:-}
      AI_ASSESSOR_MODELS: ${AI_ASSESSOR_MODELS:-}
      AI_ASSESSOR_THINK: ${AI_ASSESSOR_THINK:-}
      AI_VALIDATOR_MODEL: ${AI_VALIDATOR_MODEL:-}
      AI_VALIDATOR_THINK: ${AI_VALIDATOR_THINK:-}
      AI_DESIGNER_MODEL: ${AI_DESIGNER_MODEL:-}
      AI_DESIGNER_THINK: ${AI_DESIGNER_THINK:-}
      AI_POLL_INTERVAL: ${AI_POLL_INTERVAL:-10}
      # 1 = alleen Ollama-cloudmodellen (-cloud/:cloud); de agent weigert lokale modellen
      AI_CLOUD_ONLY: ${AI_CLOUD_ONLY:-1}
      AI_MAX_CHAT_TOKENS: ${AI_MAX_CHAT_TOKENS:-}
      AI_LLM_TIMEOUT: ${AI_LLM_TIMEOUT:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434/api/chat}
      # Leeg = de key 'docker-agent' uit de database en api.php van de webcontainer
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
    volumes:
      # Alleen lezen: voor de API key die de webcontainer aanmaakt
      - database:/data:ro

  # Worker: export/import, backup/restore en rapporten (worker-service/DESIGN.md). Werkt direct op de
  # database en de bestanden, dus lezen én schrijven op dezelfde volumes als de webcontainer.
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    init: true
    restart: unless-stopped
    # SIGINT: de lopende taak wordt afgemaakt en de worker meldt zich af
    stop_signal: SIGINT
    stop_grace_period: 2m
    depends_on:
      - leaderboard
    environment:
      # Tijdzone voor de nachtelijke backup
      TZ: ${TZ:-Europe/Amsterdam}
      WORKER_BACKUP_TIME: ${WORKER_BACKUP_TIME-03:00}
      WORKER_BACKUP_KEEP: ${WORKER_BACKUP_KEEP:-}
      WORKER_BACKUP_MANUAL_DAYS: ${WORKER_BACKUP_MANUAL_DAYS:-}
      WORKER_BACKUP_PRE_RESTORE_DAYS: ${WORKER_BACKUP_PRE_RESTORE_DAYS:-}
      WORKER_BACKUP_MIN_FREE_MB: ${WORKER_BACKUP_MIN_FREE_MB:-}
      WORKER_RESULT_TTL_DAYS: ${WORKER_RESULT_TTL_DAYS:-7}
      WORKER_MAX_ARCHIVE_MB: ${WORKER_MAX_ARCHIVE_MB:-500}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-}
      WORKER_APP_VERSION: ${WORKER_APP_VERSION:-}
    volumes:
      - database:/var/www/leaderboard/database
      - artifacts:/var/www/leaderboard/htdocs/artifacts
      - uploads:/var/www/leaderboard/htdocs/uploads
      - storage:/var/www/leaderboard/storage

  # Vangt alle uitgaande mail op: SMTP op localhost:1025, webinterface op http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27.0
    network_mode: host
    restart: unless-stopped

volumes:
  database:
  artifacts:
  uploads:
  storage:
